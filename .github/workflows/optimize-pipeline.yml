name: 🔄 Optimize AI Pipeline (Ground-Truth Tuning)

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick Optimization (reduced parameter grid)'
        type: boolean
        default: true
      trials:
        description: 'Max candidate evaluations'
        required: true
        default: '30'
  push:
    paths:
      - 'ground_truth/**'

permissions:
  contents: write

concurrency:
  group: optimize-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    name: 🧠 Auto-Tune Detection Thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚡ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 🔄 Run Pipeline Optimizer
        run: |
          QUICK_FLAG=""
          if [ "${{ inputs.quick }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            QUICK_FLAG="--quick"
          fi

          python -m hoop_stats.optimizer $QUICK_FLAG --trials ${{ inputs.trials || 30 }}

      - name: 📊 Publish Summary to GitHub Step Summary
        run: |
          if [ -f results/optimization_report.md ]; then
            cat results/optimization_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🚀 Commit & Push Optimized Parameters
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config/pipeline_params.json results/optimization_report.md
          git commit -m "chore: auto-tuned AI detection parameters via ground-truth loop [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: 📤 Upload Optimization Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimization-report
          path: results/optimization_report.md
          retention-days: 30
